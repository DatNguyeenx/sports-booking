<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' | Sports Booking'}">Tài khoản</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="page">
    <section class="card">
        <h1 th:text="${pageTitle}">Tài khoản của tôi</h1>
        <p class="muted" th:text="${description}"></p>
        <dl class="account-info" th:if="${username != null}">
            <dt>Tên đăng nhập</dt>
            <dd th:text="${username}"></dd>
            <dt th:if="${fullName != null}">Họ và tên</dt>
            <dd th:if="${fullName != null}" th:text="${fullName}"></dd>
            <dt th:if="${roleLabel != null}">Vai trò</dt>
            <dd th:if="${roleLabel != null}" th:text="${roleLabel}"></dd>
        </dl>
        <a class="button" th:href="@{/courts}">Xem danh sách sân</a>
    </section>
</main>
</body>
</html>
