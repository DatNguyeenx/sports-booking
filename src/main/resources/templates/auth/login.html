<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Sports Booking</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="auth-page">
    <section class="card" aria-labelledby="login-title">
        <h1 id="login-title">Đăng nhập</h1>
        <p class="muted">Đăng nhập để sử dụng các chức năng dành cho tài khoản của bạn.</p>
        <p class="notice notice-error" role="alert" th:if="${param.error}">
            Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
        </p>
        <p class="notice notice-success" role="status" th:if="${param.logout}">
            Bạn đã đăng xuất thành công.
        </p>
        <form th:action="@{/login}" method="post">
            <div class="auth-field">
                <label for="username">Tên đăng nhập</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       maxlength="50" required autofocus>
            </div>
            <div class="auth-field">
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <button class="button full-width" type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
</body>
</html>
