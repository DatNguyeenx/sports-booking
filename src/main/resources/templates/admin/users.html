<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Tài khoản')}"></head>
<body th:class="${ops} ? 'ops-app' : 'customer-app'">
<header th:replace="~{fragments :: header}"></header>
<main id="main-content" th:class="${ops} ? 'ops-main' : 'container page-main'">
<div th:replace="~{fragments :: alerts}"></div><nav class="breadcrumb" aria-label="Đường dẫn"><a th:href="@{/admin}">Quản trị</a><span>/</span><span>Danh mục quản lý</span></nav>
<div class="page-heading"><div><h1>Quản lý tài khoản</h1><p>Phân quyền truy cập và quản lý trạng thái tài khoản.</p></div><a class="btn btn-primary" th:href="@{/register}"><i data-lucide="user-plus"></i>Tạo tài khoản khách</a></div><section class="panel"><form class="toolbar" method="get"><div class="search-input"><i data-lucide="search"></i><input name="q" th:value="${q}" class="form-control" placeholder="Tìm kiếm theo tên..." aria-label="Tìm kiếm"></div><div class="field"><label for="role">Vai trò</label><select name="role" id="role" class="form-select"><option value="">Tất cả vai trò</option><option th:each="r:${ {'CUSTOMER','STAFF','ADMIN'} }" th:value="${r}" th:text="${roles[r]}" th:selected="${role==r}"></option></select></div><div class="field"><label for="enabled">Trạng thái</label><select class="form-select" id="enabled" name="enabled"><option value="">Tất cả trạng thái</option><option value="true" th:selected="${enabled==true}">Hoạt động</option><option value="false" th:selected="${enabled==false}">Đã khóa</option></select></div><button class="btn btn-primary">Tìm kiếm</button><a class="btn btn-secondary" th:href="${currentPath}">Đặt lại</a></form><p class="table-scroll-hint">Vuốt ngang để xem đầy đủ bảng.</p><div class="table-responsive" tabindex="0" role="region" aria-label="Bảng dữ liệu"><table class="table"><thead><tr><th>Người dùng</th><th>Số điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="i:${items}"><td><div class="cell-person"><span class="avatar"><i data-lucide="user-round"></i></span><div><b th:text="${i.fullName}"></b><small th:text="${i.email}"></small></div></div></td><td th:text="${i.phone}"></td><td th:text="${roles[i.role]}"></td><td><span class="badge" th:classappend="${i.enabled}?'status-active':'status-inactive'" th:text="${i.enabled}?'Hoạt động':'Đã khóa'"></span></td><td><div class="actions"><button class="icon-button" type="button" th:data-open-dialog="'user-'+${i.id}" aria-label="Sửa quyền tài khoản"><i data-lucide="square-pen"></i></button><form th:action="@{/admin/users/{id}/delete(id=${i.id})}" method="post" data-confirm="Bạn có chắc muốn xóa mục này? Những mục đã được sử dụng có thể không được phép xóa."><button class="icon-button text-danger" aria-label="Xóa"><i data-lucide="trash-2"></i></button></form></div><dialog class="dialog" th:id="'user-'+${i.id}" aria-label="Quản lý tài khoản"><div class="dialog-head"><h2>Quản lý tài khoản</h2><button class="icon-button" type="button" data-close-dialog aria-label="Đóng"><i data-lucide="x"></i></button></div><form th:action="@{/admin/users/{id}/save(id=${i.id})}" method="post"><div class="dialog-body"><h3 th:text="${i.fullName}"></h3><p th:text="${i.email}"></p><div class="field"><label>Vai trò<select class="form-select" name="role"><option th:each="role:${ {'CUSTOMER','STAFF','ADMIN'} }" th:value="${role}" th:text="${roles[role]}" th:selected="${i.role==role}"></option></select></label></div><label class="check-label"><input type="checkbox" name="enabled" value="true" th:checked="${i.enabled}">Tài khoản được hoạt động</label><p class="form-hint">Thay đổi quyền sẽ thu hồi phiên đăng nhập cũ.</p></div><div class="dialog-actions"><button class="btn btn-secondary" type="button" data-close-dialog>Hủy bỏ</button><button class="btn btn-primary">Lưu thay đổi</button></div></form></dialog></td></tr></tbody></table></div><th:block th:if="${items.empty}"><div th:replace="~{fragments :: empty('Không tìm thấy tài khoản','Thử tìm theo tên hoặc thư điện tử.')}"></div></th:block><nav th:replace="~{fragments :: pager(${items},'/admin/users')}"></nav></section>
</main><footer th:replace="~{fragments :: footer}"></footer>
</body></html>
