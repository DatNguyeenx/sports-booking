spring.application.name=SportBooking
spring.profiles.default=local
server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT};databaseName=SportBookingDB;encrypt=true;trustServerCertificate=false;integratedSecurity=${DB_INTEGRATED:false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# LocalDate/LocalTime are wall-clock values. Do not apply a JDBC Calendar timezone
# (historical 1970 offsets differ between Bangkok and Ho Chi Minh).
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.datasource.hikari.maximum-pool-size=16
server.error.include-message=never
server.servlet.session.cookie.http-only=true
spring.thymeleaf.cache=false
sportbooking.socket.port=${SOCKET_PORT:9090}
sportbooking.socket.host=${SOCKET_HOST:127.0.0.1}
sportbooking.socket.enabled=${SOCKET_ENABLED:true}
sportbooking.demo.enabled=${DEMO_ENABLED:false}
sportbooking.demo.password=${DEMO_PASSWORD:}
sportbooking.expiry.enabled=${EXPIRY_ENABLED:true}
sportbooking.expiry.delay=PT5M
spring.task.scheduling.thread-name-prefix=sportbooking-job-
